services:
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && node scripts/build-content.mjs --watch & npm run dev -- --host 0.0.0.0"

  preview:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4173:4173"
    command: sh -c "npm install && node scripts/build-content.mjs && npm run build && npm run preview -- --host 0.0.0.0"

volumes:
  node_modules:
